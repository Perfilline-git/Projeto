<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="Formulário/imagens/Pessoa.ico" type="image/x-icon">
    <title>Formulário</title>
    <link rel="stylesheet" href="Forms/estilos/style.css">
    <link rel="stylesheet" href="Forms/estilos/media-query.css"
</head>
<body>
    <main>
        <section id="cadastro">
            <div id="imagem">
                <!-- Aqui vai a imagem nas CSS -->
            </div>
            <div id="formulario">
                <h1>Formulário</h1>
                <p>Forneça dados para efetuar o cadastro</p>
                <h1></h1>
                <style>
                    * {
                        font-family: Arial, Helvetica, sans-serif;
                    }
                </style>
                <body>
                    <form action="index.html" autocomplete="off">
                        <p>
                            <label for="iuser">Usuário:</label>
                            <br>
                            <input type="email" name="login" id="ilogin" required minlength="7" placeholder=" Email">
                        <p>
                            <label for="isenha">Senha:</label>
                            <br>
                            <input type="password" name="senha" id="isenha" minlength="4"
                                pattern="([a-z])*[A-Z])([0-9])([^A-Za-z0-9])" autocomplete="current-password" required>
                        <p><label for="iconfirmarsenha">Confirmar nova senha:</label>
                            <br>
                            <input type="password" name="confirmar_senha" id="iconfirmarsenha" minlength="8"
                                pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}"
                                title="A senha deve ter no mínimo 8 caracteres, uma letra maiúscula, uma letra minúscula, um número e um caractere especial."
                                autocomplete="new-password" required>
                        </p>
                        <p><input type="reset" value="Limpar" onclick="alert('Os dados foram limpos! 🧹☁️😶‍🌫️')">
                        </p><p><input type="submit" value="Cadastrar">
                                </button>
                            </p>
                        </form>
                    </form>
                </body>
            </div>
        </section>
    </main>
</body>
</html>
