<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="shortcut icon" href="Checklist/imagens/Forms.png" type="image/x-icon">

    <title>Checklist</title>

    <link rel="stylesheet" href="Forms/estilos/style.css">
    <link rel="stylesheet" href="Forms/estilos/media-query.css">

    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>

<body>
    <main>
        <section id="cadastro">

            <div id="imagem">
                <!-- Aqui vai a imagem nas CSS -->
            </div>

            <div id="formulario">

                <h1>Checklist</h1>

                <p>Forneça os dados para efetuar o checklist</p>

                <form action="" method="get" autocomplete="on">

                    <p>
                        <label for="inome">Nome:</label>
                        <br>
                        <input type="text" name="nome" id="inome" required maxlength="30" placeholder="Nome completo"
                            autocomplete="name">
                    </p>
                    <p>
                        <label for="imedia">Média:</label>
                        <br>
                        <input type="number" name="media" id="imedia" min="0" max="10" step="0.1" value=""
                            placeholder="0 a 10" required>
                    </p>
                    <p>
                        <label for="imes">Período Letivo:</label>
                        <br>
                        <input type="month" name="mes" id="imes" value="">
                    </p>
                    <p>
                        <label for="idia">Dia da Prova:</label>
                        <br>
                        <input type="date" name="dia" id="idia">
                    </p>
                    <input type="reset" value="Limpar" onclick="alert('Os dados foram limpos! 🧹☁️😶‍🌫️')">
                    <p>
                        <input type="submit" value="Cadastrar">
                    </p>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
